<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連線測試</title>
<style>
  :root {
    --bg: #14161a; --panel: #1e2127; --line: #333842;
    --text: #e8eaee; --dim: #8b92a0; --go: #3b82c4; --stop: #d6453d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, "Noto Sans TC", sans-serif; max-width: 480px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  label { display: block; color: var(--dim); font-size: 14px; margin-bottom: 4px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    padding: 14px 8px; border-radius: 8px; border: 0; font-size: 16px; color: #fff; background: var(--go);
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #stop { background: var(--stop); width: 100%; padding: 26px 8px; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  .cmds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  #status { font-size: 14px; color: var(--dim); }
  #log { height: 180px; overflow-y: auto; font: 13px/1.5 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--text); }
  .check input { width: 20px; height: 20px; }
</style>
</head>
<body>
<h1>連線測試</h1>

<button id="stop">停止</button>

<section>
  <label for="code">連線碼（用官方 app 啟動時會自動帶入）</label>
  <input id="code" type="text" placeholder="uid token" autocomplete="off">
  <div id="status" style="margin-top:8px"></div>
  <button id="conn" style="margin-top:10px;width:100%">測試連線（只登入，不送指令）</button>
</section>

<section>
  <label class="check"><input id="dry" type="checkbox" checked> 模擬模式（只顯示要送出的指令，不真的送）</label>
  <div class="row" style="margin-top:12px">
    <div>
      <label for="maxsec">單次最長秒數</label>
      <input id="maxsec" type="number" min="1" max="30" value="5">
    </div>
  </div>
</section>

<section>
  <label>指令 ID（要和你在 app 裡設定的一致，逗號分隔）</label>
  <input id="ids" type="text" value="low,mid,high,edge">
  <div class="cmds" id="cmds"></div>
</section>

<section>
  <label>節奏模式（用到 low / mid / high 三個指令，需先在 app 設好）</label>
  <div class="cmds" id="pats"></div>
  <label for="patmax" style="margin-top:10px">模式最長秒數（到時自動停止）</label>
  <input id="patmax" type="number" min="5" max="60" value="20">
</section>

<section>
  <label>紀錄</label>
  <div id="log"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
let token = "";
let stopTimer = null;

function log(msg) {
  const t = new Date().toLocaleTimeString();
  $("log").textContent += `[${t}] ${msg}\n`;
  $("log").scrollTop = $("log").scrollHeight;
}

function setStatus() {
  $("status").textContent = token ? "已取得連線碼" : "尚未取得連線碼";
}

// 連線碼：uid 與 token 以空格分隔，指令只需要 token
let uid = "";
function applyCode(raw) {
  const parts = (raw || "").trim().split(/\s+/);
  uid = parts.length > 1 ? parts[0] : "";
  token = parts.length > 1 ? parts[1] : "";
  resetIM();
  setStatus();
}

try {
  const fromUrl = new URLSearchParams(location.search).get("connect_code");
  if (fromUrl) {
    $("code").value = fromUrl;
    try { localStorage.setItem("connect_code", fromUrl); } catch (e) {}
  } else {
    try { $("code").value = localStorage.getItem("connect_code") || ""; } catch (e) {}
  }
} catch (e) {}
applyCode($("code").value);
$("code").addEventListener("input", (e) => applyCode(e.target.value));

// ---- 騰訊 IM（流程依官方 ycy_im_demo.ts）----
const API_BASE = "https://suo.jiushu1234.com/api.php";
// 此 SDK 網址我沒有實際驗證過；若載入失敗，紀錄會顯示錯誤，請告訴我
const SDK_URL = "https://cdn.jsdelivr.net/npm/@tencentcloud/chat@3/index.js";
let chat = null;
let imPromise = null;

function loadSdk() {
  if (window.TencentCloudChat) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = SDK_URL;
    s.onload = () => window.TencentCloudChat ? resolve() : reject(new Error("SDK 載入後找不到 TencentCloudChat"));
    s.onerror = () => reject(new Error("SDK 載入失敗"));
    document.head.appendChild(s);
  });
}

function resetIM() {
  imPromise = null;
  if (chat) { try { chat.logout(); chat.destroy(); } catch (e) {} chat = null; }
}

async function initIM() {
  if (!uid || !token) throw new Error("連線碼格式應為「uid token」");
  await loadSdk();
  const resp = await fetch(`${API_BASE}/user/game_sign`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ connect_code: $("code").value.trim() }),
  });
  if (!resp.ok) throw new Error("game_sign HTTP " + resp.status);
  const j = await resp.json();
  if (j.code !== 1 || !j.data) throw new Error("game_sign 失敗：" + (j.msg || JSON.stringify(j)));

  chat = TencentCloudChat.create({ SDKAppID: j.data.appid });
  chat.setLogLevel(1);
  const ready = new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error("等待 SDK_READY 逾時")), 15000);
    chat.on(TencentCloudChat.EVENT.SDK_READY, () => { clearTimeout(t); resolve(); });
  });
  chat.on(TencentCloudChat.EVENT.KICKED_OUT, () => { log("IM 被踢下線"); resetIM(); });
  await chat.login({ userID: "game_" + uid, userSig: j.data.sign });
  await ready;
  log("IM 已連線");
}

function ensureIM() {
  if (!imPromise) imPromise = initIM().catch((e) => { imPromise = null; throw e; });
  return imPromise;
}

async function imSend(text) {
  await ensureIM();
  const msg = chat.createTextMessage({
    to: uid,
    conversationType: TencentCloudChat.TYPES.CONV_C2C,
    payload: { text },
  });
  await chat.sendMessage(msg);
}

async function testConnection() {
  try { await ensureIM(); } catch (e) { log("連線失敗：" + e.message); }
}

async function sendCmd(id) {
  const payload = JSON.stringify({ code: "game_cmd", id, token: token || "(未填)" });
  if ($("dry").checked) {
    log("模擬 → " + payload);
    return;
  }
  if (!token) { log("沒有連線碼，未送出"); return; }
  try {
    await imSend(payload);
    log("已送出 → " + id);
  } catch (e) {
    log("送出失敗：" + e.message);
  }
}

// 節奏模式：[指令ID, 持續秒數]，每步至少 2 秒
const PATTERNS = {
  steady_low: { label: "穩定低頻", steps: [["low", 8]], loop: false },
  ramp_up:    { label: "漸進加快", steps: [["low", 3], ["mid", 3], ["high", 3]], loop: false },
  tease:      { label: "高低交替", steps: [["high", 3], ["low", 2]], loop: true },
};
let patTimer = null;

function cancelPattern() { clearTimeout(patTimer); patTimer = null; }

function runPattern(name) {
  cancelPattern();
  clearTimeout(stopTimer);
  const p = PATTERNS[name];
  const limit = Math.min(Math.max(Number($("patmax").value) || 20, 5), 60) * 1000;
  const t0 = Date.now();
  let i = 0;
  log("開始模式：" + p.label);
  const step = () => {
    if (Date.now() - t0 >= limit) { log("模式時間到，停止"); patTimer = null; sendCmd("_stop_all"); return; }
    if (i >= p.steps.length) {
      if (p.loop) i = 0;
      else { log("模式結束，停止"); patTimer = null; sendCmd("_stop_all"); return; }
    }
    const [cmd, sec] = p.steps[i++];
    sendCmd(cmd);
    patTimer = setTimeout(step, Math.max(sec, 2) * 1000);
  };
  step();
}

function renderPatterns() {
  const box = $("pats");
  Object.entries(PATTERNS).forEach(([name, p]) => {
    const b = document.createElement("button");
    b.textContent = p.label;
    b.addEventListener("click", () => runPattern(name));
    box.appendChild(b);
  });
}

function stopAll() {
  clearTimeout(stopTimer);
  cancelPattern();
  sendCmd("_stop_all");
}

function run(id) {
  clearTimeout(stopTimer);
  cancelPattern();
  sendCmd(id);
  const sec = Math.min(Math.max(Number($("maxsec").value) || 5, 1), 30);
  stopTimer = setTimeout(() => { log(`${sec} 秒到，自動停止`); sendCmd("_stop_all"); }, sec * 1000);
}

function renderButtons() {
  const box = $("cmds");
  box.innerHTML = "";
  $("ids").value.split(",").map((s) => s.trim()).filter(Boolean).forEach((id) => {
    const b = document.createElement("button");
    b.textContent = id;
    b.addEventListener("click", () => run(id));
    box.appendChild(b);
  });
}
$("ids").addEventListener("input", renderButtons);
renderButtons();
renderPatterns();

$("conn").addEventListener("click", testConnection);
$("stop").addEventListener("click", stopAll);
window.addEventListener("pagehide", stopAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) stopAll(); });
log("頁面就緒。目前為模擬模式。");
</script>
</body>
</html>
