<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>👑 AI 調教終端 (雙模式整合版)</title>
  <!-- 載入 MediaPipe Pose CDN 以進行瀏覽器端即時人體骨架偵測 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a22;
      --accent: #e11d48;
      --accent-glow: rgba(225, 29, 72, 0.45);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --green: #10b981;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* 頂部狀態列 */
    header { background: var(--card); padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a35; z-index: 20; flex-shrink: 0; }
    .title-area h1 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .status-text { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .header-btns { display: flex; gap: 5px; }
    button { border: none; border-radius: 8px; padding: 7px 9px; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; background: #2d2d3a; transition: 0.15s; }
    button:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); }

    /* 模式切換分頁列 */
    .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; background: #14141b; border-bottom: 1px solid #2a2a35; flex-shrink: 0; z-index: 19; }
    .tab-btn { background: transparent; border-radius: 0; padding: 10px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #fff; font-weight: 800; border-bottom: 2px solid var(--accent); background: rgba(225, 29, 72, 0.08); }

    /* 折疊設定與手動面板 */
    .drawer { background: #16161d; padding: 12px 14px; border-bottom: 1px solid #2a2a35; display: none; flex-direction: column; gap: 8px; font-size: 13px; z-index: 18; flex-shrink: 0; }
    .drawer.open { display: flex; }
    .drawer input[type="text"], .drawer input[type="password"] { width: 100%; background: #0f0f13; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; font-size: 13px; }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }

    /* 可拉上拉下收合的上方狀態區塊 */
    .collapsible-top {
      overflow: hidden;
      transition: max-height 0.28s ease, opacity 0.22s ease;
      max-height: 120px;
      opacity: 1;
      flex-shrink: 0;
    }
    .collapsible-top.collapsed {
      max-height: 0;
      opacity: 0;
      border: none;
    }
    .toggle-top-bar {
      width: 100%;
      background: #14141c;
      color: #9ca3af;
      border: none;
      border-radius: 0;
      border-bottom: 1px solid #2a2a35;
      padding: 5px 0;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }
    .toggle-top-bar:active {
      background: #232330;
      color: #fff;
    }

    /* 雙欄儀表板 */
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); padding: 8px; text-align: center; border-bottom: 1px solid #2a2a35; z-index: 17; flex-shrink: 0; }
    .dash-label { font-size: 11px; color: var(--muted); }
    .dash-val { font-size: 17px; font-weight: 800; color: var(--accent); margin-top: 2px; }

    /* 視圖容器切換 */
    .view-container { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; }
    .view-container.active { display: flex; }

    /* ================= 視圖 1：對話調教模式 ================= */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      background-color: var(--bg);
      background-image: linear-gradient(rgba(15, 15, 19, 0.78), rgba(15, 15, 19, 0.85)), url('bg.jpg');
      background-size: cover;
      background-position: center top;
      background-attachment: local;
    }
    .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 92%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ai { align-self: flex-start; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--accent); box-shadow: 0 0 10px var(--accent-glow);
      flex-shrink: 0; cursor: pointer; background: #252530;
    }
    .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-break: break-word; backdrop-filter: blur(4px); }
    .msg-row.user .bubble { background: rgba(43, 43, 56, 0.92); color: #fff; border-bottom-right-radius: 4px; }
    .msg-row.ai .bubble { background: rgba(28, 22, 30, 0.92); border-left: 3px solid var(--accent); border-top-left-radius: 4px; }
    .cmd-tag { display: block; margin-top: 6px; font-size: 11px; color: #fb7185; font-weight: 600; }
    .sys-msg { align-self: center; font-size: 12px; color: var(--muted); background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 12px; text-align: center; }

    .quick-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px 12px 0; background: var(--card); border-top: 1px solid #2a2a35; flex-shrink: 0; }
    .quick-bar button { font-size: 12px; padding: 8px 4px; background: #262632; }
    .input-bar { display: flex; gap: 8px; padding: 8px 12px; background: var(--card); flex-shrink: 0; }
    .input-bar input { flex: 1; background: #0f0f13; border: 1px solid #333; color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 14px; outline: none; }

    /* ================= 視圖 2：鏡頭姿勢考驗模式 ================= */
    #pose-view { background: #09090c; position: relative; }
    .camera-stage {
      flex: 1; position: relative; width: 100%; overflow: hidden; background: #000;
      display: flex; justify-content: center; align-items: center;
    }
    #pose-video { display: none; }
    #pose-canvas {
      width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1);
    }

    /* 遠距離超大指令字卡（支援一鍵收合放大視野） */
    .pose-hud-top {
      position: absolute; top: 8px; left: 8px; right: 8px; z-index: 10;
      background: rgba(15, 15, 22, 0.78); backdrop-filter: blur(6px);
      border: 2px solid #333; border-radius: 14px; padding: 8px 10px;
      text-align: center; transition: all 0.2s ease;
    }
    .pose-hud-top.matched { border-color: var(--green); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
    .pose-hud-top.punishing { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
    .pose-hud-top.surrendered { border-color: var(--amber); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }

    .pose-hud-header {
      display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 2px;
    }
    .pose-rule-tag {
      display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 10px;
      background: #2d2d3a; color: #fda4af; text-align: left;
    }
    .btn-hud-mini {
      padding: 2px 7px; font-size: 10px; background: rgba(255,255,255,0.14); color: #e5e7eb; border-radius: 6px; flex-shrink: 0;
    }
    .pose-target-title {
      font-size: 23px; font-weight: 900; letter-spacing: 1px; color: #fff; line-height: 1.2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .pose-sub-status {
      font-size: 12px; font-weight: 700; color: var(--amber); margin-top: 3px; line-height: 1.3;
    }
    .pose-progress-wrap {
      width: 100%; height: 6px; background: #272732; border-radius: 4px; overflow: hidden; margin-top: 6px;
    }
    .pose-progress-bar {
      height: 100%; width: 0%; background: var(--green); transition: width 0.15s linear;
    }

    .pose-hud-top.mini .pose-rule-tag,
    .pose-hud-top.mini .pose-sub-status {
      display: none;
    }
    .pose-hud-top.mini .pose-target-title {
      font-size: 17px;
    }

    /* 站位距離與手勢緊急求饒提示膠囊 */
    .pose-tip-pill {
      position: absolute; top: 118px; left: 50%; transform: translateX(-50%); z-index: 9;
      background: rgba(0, 0, 0, 0.68); border: 1px solid rgba(255,255,255,0.18);
      padding: 3px 10px; border-radius: 20px; font-size: 11px; color: #e5e7eb;
      white-space: nowrap; pointer-events: none; transition: top 0.2s ease;
    }
    .pose-tip-pill.mini-offset {
      top: 56px;
    }

    /* 女王最新語音台詞字幕條 */
    .pose-queen-caption {
      position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 10;
      background: rgba(24, 18, 26, 0.84); border-left: 4px solid var(--accent);
      padding: 7px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.35;
      display: flex; align-items: center; gap: 8px;
    }
    .pose-queen-caption img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent); flex-shrink: 0; }

    /* 姿勢模式控制面板 */
    .pose-controls {
      background: var(--card); padding: 8px 12px 0; border-top: 1px solid #2a2a35;
      display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }
    .pose-control-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .pose-control-row button { padding: 8px 4px; font-size: 12px; background: #262632; }
    .btn-pose-edge { background: #9f1239 !important; color: #fff !important; font-weight: 800; }
    .pose-option-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11.5px; color: #d1d5db; padding: 2px 2px 0;
    }
    .pose-option-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .pose-option-bar input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }

    /* 底部共用緊急停止按鈕 */
    .stop-bar { padding: 8px 12px 12px; background: var(--card); flex-shrink: 0; }
    .btn-stop { width: 100%; background: #dc2626; padding: 11px; font-size: 14px; font-weight: 800; border-radius: 10px; }

    /* 大頭貼點擊放大預覽視窗 */
    #img-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 99;
      justify-content: center; align-items: center; flex-direction: column; padding: 20px;
    }
    #img-modal.show { display: flex; }
    #img-modal img { max-width: 92%; max-height: 80vh; border-radius: 12px; border: 2px solid var(--accent); box-shadow: 0 0 25px var(--accent-glow); }
    #img-modal span { margin-top: 12px; font-size: 13px; color: var(--muted); }

    /* 倒數計時影片互動視窗 */
    #countdown-modal {
      display: none; position: fixed; inset: 0; background: rgba(10, 10, 14, 0.94); z-index: 100;
      flex-direction: column; justify-content: center; align-items: center; padding: 20px;
      backdrop-filter: blur(8px);
    }
    #countdown-modal.show { display: flex; }
    .cd-box {
      position: relative; width: 100%; max-width: 380px; aspect-ratio: 9 / 14;
      background: #1a1a22; border-radius: 16px; border: 2px solid var(--accent);
      box-shadow: 0 0 35px var(--accent-glow); overflow: hidden;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background-image: linear-gradient(rgba(15, 15, 19, 0.45), rgba(15, 15, 19, 0.65)), url('bg.jpg');
      background-size: cover; background-position: center;
    }
    #cd-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    .cd-overlay { position: absolute; bottom: 24px; right: 24px; z-index: 2; text-align: right; pointer-events: none; text-shadow: 0 4px 20px rgba(0,0,0,0.95); }
    .cd-title { font-size: 14px; font-weight: 700; color: #fda4af; letter-spacing: 1px; margin-bottom: 4px; }
    #cd-number { font-size: 96px; font-weight: 900; color: #fff; line-height: 1; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes alarm-shake {
      0%, 100% { transform: translate(0, 0) scale(1.25); }
      25% { transform: translate(-6px, 4px) scale(1.3); }
      50% { transform: translate(6px, -4px) scale(1.3); }
      75% { transform: translate(-6px, -4px) scale(1.3); }
    }
    .shake-zero { color: #e11d48 !important; animation: alarm-shake 0.35s infinite; }
    .cd-speed-badge { margin-top: 10px; display: inline-block; background: rgba(225, 29, 72, 0.9); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
    .cd-actions { width: 100%; max-width: 380px; margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .btn-cd-edge { width: 100%; background: var(--accent); padding: 12px; font-size: 15px; font-weight: 800; border-radius: 10px; }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>👑 AI 調教終端</h1>
      <div class="status-text" id="ble-status">🔴 未連線</div>
    </div>
    <div class="header-btns">
      <button class="btn-primary" onclick="connectBLE()">🔗 連線</button>
      <button onclick="toggleDrawer('manual-drawer')">🎛️ 手動</button>
      <button onclick="toggleDrawer('settings-drawer')">⚙️ 設定</button>
    </div>
  </header>

  <!-- 模式切換列（共用同一條藍牙連線） -->
  <div class="mode-tabs">
    <button class="tab-btn active" id="tab-chat" onclick="switchAppMode('chat')">💬 對話調教</button>
    <button class="tab-btn" id="tab-pose" onclick="switchAppMode('pose')">📷 姿勢考驗 (免打字)</button>
  </div>

  <!-- 設定面板 -->
  <div class="drawer" id="settings-drawer">
    <label>API Endpoint：</label>
    <input type="text" id="api-url" value="http://192.168.0.100:8000/chat" onchange="saveSettings()" />
    <label>API Key（本地端隨意填即可）：</label>
    <input type="password" id="api-key" value="ollama" onchange="saveSettings()" />
    <label>模型名稱：</label>
    <input type="text" id="api-model" value="qwen2.5" onchange="saveSettings()" />
    <label style="display:flex; align-items:center; gap:8px; margin-top:4px; color:#fff;">
      <input type="checkbox" id="tts-enable" checked onchange="saveSettings()" style="width:auto;" />
      開啟女王語音朗讀 (TTS，姿勢模式建議開啟)
    </label>
  </div>

  <!-- 手動測試面板 -->
  <div class="drawer" id="manual-drawer">
    <div class="slider-row">
      <span>手動強度 (0-20)：<strong id="manual-val">0</strong></span>
      <input type="range" min="0" max="20" value="0" oninput="manualControl(this.value)" />
    </div>
  </div>

  <!-- 可拉上拉下收合的雙欄狀態儀表板 -->
  <div id="top-status-wrapper" class="collapsible-top">
    <div class="dashboard">
      <div>
        <div class="dash-label">當前模式</div>
        <div class="dash-val" id="ui-mode">待機</div>
      </div>
      <div>
        <div class="dash-label">強度 (0-20)</div>
        <div class="dash-val" id="ui-motor-a">0</div>
      </div>
    </div>
  </div>
  <button id="btn-toggle-top" class="toggle-top-bar" onclick="toggleTopStatus()">▲ 收起上方狀態（放大鏡頭畫面）</button>

  <!-- ================= 視圖 1：對話調教模式 ================= -->
  <div id="chat-view" class="view-container active">
    <div id="chat-box">
      <div class="sys-msg">請點擊右上角「🔗 連線」配對設備，或切換上方「📷 姿勢考驗」開啟前置鏡頭互動。</div>
    </div>

    <div class="quick-bar">
      <button onclick="sendQuick('嗚嗚嗚...女王，我快要忍不住射出來了，現在大約9分狀態！')">🥵 快射了</button>
      <button onclick="sendQuick('求求女王賞賜我高潮，我想射出來...')">🙏 請求高潮</button>
      <button onclick="sendQuick('女王，現在的強度不夠，請給我更強烈的刺激！')">🔥 加強刺激</button>
    </div>
    <div class="input-bar">
      <input type="text" id="user-input" placeholder="輸入你想對女王說的話..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="btn-primary" onclick="sendMessage()">發送</button>
    </div>
  </div>

  <!-- ================= 視圖 2：鏡頭姿勢考驗模式 ================= -->
  <div id="pose-view" class="view-container">
    <div class="camera-stage">
      <video id="pose-video" playsinline></video>
      <canvas id="pose-canvas"></canvas>

      <!-- 遠距離高對比指令字卡（支援一鍵收合放大視野） -->
      <div class="pose-hud-top" id="pose-hud">
        <div class="pose-hud-header">
          <div class="pose-rule-tag" id="pose-rule-badge">獎勵制：擺對姿勢維持 3 秒 → 獎勵抽插 10 秒</div>
          <button class="btn-hud-mini" id="btn-hud-mini" onclick="togglePoseHudMini()">▲ 收合提示</button>
        </div>
        <div class="pose-target-title" id="pose-target-name">準備開始考驗</div>
        <div class="pose-sub-status" id="pose-sub-text">建議退後約 1.5~2 公尺，讓腰部以上完整入鏡</div>
        <div class="pose-progress-wrap">
          <div class="pose-progress-bar" id="pose-progress"></div>
        </div>
      </div>

      <!-- 遠距離緊急求饒手勢提示 -->
      <div class="pose-tip-pill" id="pose-distance-tip">🙅 雙手在胸前比大叉叉 (X) 維持 1 秒 = 遠距離「快射了」煞車</div>

      <!-- 女王語音字幕條 -->
      <div class="pose-queen-caption">
        <img id="pose-queen-avatar" src="queen.jpg" onerror="handleAvatarError(this)" alt="女王" />
        <div id="pose-queen-text">點擊下方「▶️ 開始 / 換題」讓本女王下達姿勢命令！</div>
      </div>
    </div>

    <!-- 姿勢模式專屬按鈕列 -->
    <div class="pose-controls">
      <div class="pose-control-row">
        <button class="btn-primary" id="btn-pose-start" onclick="handleStartOrNextPose()">▶️ 開始 / 換題</button>
        <button onclick="togglePoseRuleMode()" id="btn-pose-rule">🔄 切換：獎勵制</button>
        <button class="btn-pose-edge" onclick="triggerPoseEdgeBrake()">🥵 快射了</button>
      </div>
      <div class="pose-option-bar">
        <label>
          <input type="checkbox" id="require-undress-chk" checked onchange="resetUndressFlag()" />
          👕 開場先要求脫掉上衣（偵測裸露上半身）
        </label>
        <span id="skin-debug-tag" style="color:#9ca3af;">裸露度: --%</span>
      </div>
    </div>
  </div>

  <!-- 底部共用緊急停止按鈕 -->
  <div class="stop-bar">
    <button class="btn-stop" onclick="emergencyStop()">🛑 緊急安全停止 (全部歸零)</button>
  </div>

  <!-- 點擊頭像放大預覽 -->
  <div id="img-modal" onclick="this.classList.remove('show')">
    <img id="modal-img" src="" alt="女王立繪" />
    <span>點擊畫面任意處關閉</span>
  </div>

  <!-- 倒數計時互動彈窗 -->
  <div id="countdown-modal">
    <div class="cd-box">
      <video id="cd-video" src="countdown.mp4" playsinline onerror="this.style.display='none'"></video>
      <div class="cd-overlay">
        <div class="cd-title">沒有允許不准射出來</div>
        <div id="cd-number">10</div>
        <div class="cd-speed-badge" id="cd-speed-text">當前強度：4 / 20</div>
      </div>
    </div>
    <div class="cd-actions">
      <button class="btn-cd-edge" onclick="reportEdgeDuringCountdown()">🥵 快射了！（向女王回報）</button>
      <button class="btn-stop" onclick="emergencyStop()">🛑 緊急安全停止</button>
    </div>
  </div>

<script>
  // ================= 0. 上方狀態列與字卡收合控制 =================
  function toggleTopStatus() {
    const wrapper = document.getElementById('top-status-wrapper');
    const btn = document.getElementById('btn-toggle-top');
    const isCollapsed = wrapper.classList.toggle('collapsed');

  function updateBleHeaderText() {
    const statusEl = document.getElementById('ble-status');
    if (!connectedDeviceName) return;
    statusEl.innerText = currentBattery !== null
      ? `🟢 已連線 (${connectedDeviceName}) | 🔋 ${currentBattery}%`

  async function connectBLE() {
    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [0xff40]
      });

      bleDevice.addEventListener('gattserverdisconnected', handleBLEDisconnected);

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(0xff40);
      writeChar = await service.getCharacteristic(0xff41);

      connectedDeviceName = bleDevice.name || '設備';
      currentBattery = null;

      try {
        const notifyChar = await service.getCharacteristic(0xff42);
        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', (e) => {
          const data = new Uint8Array(e.target.value.buffer);
          if (data[0] === 0x35 && data[1] === 0x22 && data.length >= 3) {
            currentBattery = data[2];
            updateBleHeaderText();
          } else if (data[0] === 0x35 && data[1] === 0x13 && data[2] === 0x01 && data.length >= 4) {
            currentBattery = data[3];
            updateBleHeaderText();
          }
        });

        const batQuerySum = (0x35 + 0x22) & 0xff;
        await writeChar.writeValueWithoutResponse(new Uint8Array([0x35, 0x22, batQuerySum]));
      } catch (_) {}

      updateBleHeaderText();
      document.getElementById('ble-status').style.color = '#10b981';
      appendSysMsg(`✅ 已成功連接 ${connectedDeviceName}`);

      clearInterval(connectionWatchdog);
      connectionWatchdog = setInterval(() => {
        if (bleDevice && !bleDevice.gatt.connected) {
          handleBLEDisconnected();
        }
      }, 2000);

    } catch (err) {
      appendSysMsg(`⚠️ 藍牙連線失敗：${err.message}`);
    }
  }

  function handleBLEDisconnected() {
    clearInterval(connectionWatchdog);
    writeChar = null;
    connectedDeviceName = '';
    currentBattery = null;
    clearAllTimers();
    sendMotorSpeed(0, 0, 0);
    document.getElementById('ui-mode').innerText = '已斷線';

    const sum = (0x35 + 0x12 + a + 0 + 0) & 0xff;

    try {

  function startCountdownMode(abortAt, abortText) {
    clearAllTimers();
    document.getElementById('ui-mode').innerText = MODE_NAMES.countdown_10;

    const modal = document.getElementById('countdown-modal');
    const video = document.getElementById('cd-video');
    const numEl = document.getElementById('cd-number');
    const speedBadge = document.getElementById('cd-speed-text');

    numEl.classList.remove('shake-zero');
    modal.classList.add('show');
    if (video) {
      video.style.display = 'block';
      video.currentTime = 0;
      video.muted = false;
      video.volume = 1.0;
      video.play().catch(() => {
        video.muted = true;
        video.play().catch(() => { video.style.display = 'none'; });
      });
    }

    let sec = 10;
    const startSpeed = 4;
    const endSpeed = 20;

    function updateStep(currentSec) {
      const progress = (10 - currentSec) / 10;
      const currentSpeed = Math.round(startSpeed + progress * (endSpeed - startSpeed));

      if (currentSec === 0) {
        numEl.innerText = '0!';
        numEl.classList.add('shake-zero');
      } else {
        numEl.innerText = currentSec;
        numEl.style.transform = 'scale(1.25)';
        setTimeout(() => { numEl.style.transform = 'scale(1)'; }, 180);
      }

      speedBadge.innerText = `當前強度：${currentSpeed} / 20`;
      sendMotorSpeed(currentSpeed);
    }

    updateStep(sec);

    countdownInterval = setInterval(() => {
      sec--;

      if (abortAt > 0 && sec === abortAt) {
        clearInterval(countdownInterval);
        closeCountdownModal();
        sendMotorSpeed(0);
        document.getElementById('ui-mode').innerText = MODE_NAMES.stop;

        const taunt = abortText || `在剩餘 ${abortAt} 秒時突然喊停！哈哈，看你一臉快要失守的蠢樣，沒有本女王的允許，誰准你射出來了？給我好好忍著！`;
        appendQueenMsg(taunt, 'stop', 0);
        speakQueenText(taunt);
        chatHistory.push({ role: 'assistant', content: JSON.stringify({ mode: 'stop', intensity: 0, dialogue: taunt }) });
        return;
      }

      if (sec >= 0) updateStep(sec);

      if (sec === 0) {
        clearInterval(countdownInterval);
        document.getElementById('ui-mode').innerText = MODE_NAMES.climax;
        speedBadge.innerText = '🔥 倒數結束！極限全速衝刺 (20/20)';
        setTimeout(() => { closeCountdownModal(); }, 4000);
      }
    }, 1000);
  }

  // 計算胸腹部區域（由雙肩與雙腰圍成的矩形內）的膚色像素比例（YCbCr 膚色模型，抗燈光偏色）
  function computeTorsoSkinRatio(ctx, w, h, m) {
    if (!m || !m.ls || !m.rs) return 0;
    const minX = Math.max(0, Math.floor(Math.min(m.ls.x, m.rs.x) * w));
    const maxX = Math.min(w - 1, Math.ceil(Math.max(m.ls.x, m.rs.x) * w));
    const topY = Math.max(0, Math.floor((m.shoulderMidY + m.shoulderWidth * 0.15) * h));
    const bottomY = Math.min(h - 1, Math.ceil((m.shoulderMidY + m.shoulderWidth * 1.15) * h));

    const boxW = maxX - minX;
    const boxH = bottomY - topY;
    if (boxW < 16 || boxH < 16) return 0;

    try {
      const imgData = ctx.getImageData(minX, topY, boxW, boxH).data;
      let skinPixels = 0;
      let totalSampled = 0;

      // 每隔 2 個像素取樣以保持極高幀率
      for (let i = 0; i < imgData.length; i += 8) {
        const r = imgData[i];
        const g = imgData[i + 1];
        const b = imgData[i + 2];
        totalSampled++;

        // 轉換至 YCbCr 色彩空間進行膚色判斷
        const y  =  0.299 * r + 0.587 * g + 0.114 * b;
        const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
        const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;

        if (y > 45 && cr >= 133 && cr <= 178 && cb >= 77 && cb <= 127 && r > g && r > b) {
          skinPixels++;
        }
      }
      return totalSampled > 0 ? (skinPixels / totalSampled) : 0;
    } catch (_) {
      return 0;
    }
  }

  function getBodyMetrics(lm) {
    const nose = lm[0], le = lm[7], re = lm[8];
    const ls = lm[11], rs = lm[12];
    const lelb = lm[13], relb = lm[14];
    const lw = lm[15], rw = lm[16];
    const lh = lm[23], rh = lm[24];
    const lk = lm[25], rk = lm[26];

    if (!ls || !rs || ls.visibility < 0.45 || rs.visibility < 0.45) return null;

    const shoulderWidth = Math.hypot(ls.x - rs.x, ls.y - rs.y);
    const shoulderMidX = (ls.x + rs.x) / 2;
    const shoulderMidY = (ls.y + rs.y) / 2;
    const headY = nose ? nose.y : (shoulderMidY - shoulderWidth * 0.6);

    return {
      nose, le, re, ls, rs, lelb, relb, lw, rw, lh, rh, lk, rk,
      shoulderWidth, shoulderMidX, shoulderMidY, headY
    };
  }

  function checkCrossArmsSurrender(m) {
    if (!m || !m.lw || !m.rw || !m.lelb || !m.relb) return false;
    if (m.lw.visibility < 0.45 || m.rw.visibility < 0.45) return false;

    const inChestZone = (m.lw.y > m.headY) && (m.rw.y > m.headY) &&
                        (m.lw.y < m.shoulderMidY + m.shoulderWidth * 1.4) &&
                        (m.rw.y < m.shoulderMidY + m.shoulderWidth * 1.4);

    const wristsClose = Math.hypot(m.lw.x - m.rw.x, m.lw.y - m.rw.y) < m.shoulderWidth * 0.75;
    const elbowsWiderThanWrists = Math.abs(m.lelb.x - m.relb.x) > Math.abs(m.lw.x - m.rw.x) * 1.25;

    },
    hands_behind_head: {
      name: '🙆 雙手抱頭屈服',
      desc: '雙手放到耳朵／頭兩側，手肘向外張開！',
      check: (m) => {
        if (!m || !m.lw || !m.rw || !m.lelb || !m.relb) return false;
        if (m.lw.visibility < 0.4 || m.rw.visibility < 0.4) return false;
        const headLevelY = (m.lw.y < m.shoulderMidY) && (m.rw.y < m.shoulderMidY) &&
                           (m.lw.y > m.headY - m.shoulderWidth * 0.45) && (m.rw.y > m.headY - m.shoulderWidth * 0.45);
        const nearHeadX = Math.abs(m.lw.x - m.shoulderMidX) < m.shoulderWidth * 0.85 &&
                          Math.abs(m.rw.x - m.shoulderMidX) < m.shoulderWidth * 0.85;
        const elbowsWide = Math.abs(m.lelb.x - m.relb.x) > m.shoulderWidth * 1.15;
        return headLevelY && nearHeadX && elbowsWide;
      }
    },
    t_pose: {
      name: '✝️ 雙手水平張開',
      desc: '雙臂向左右兩側完全伸直平舉（呈 T 字型）！',
      check: (m) => {
        if (!m || !m.lw || !m.rw || m.lw.visibility < 0.45 || m.rw.visibility < 0.45) return false;
        const levelY = Math.abs(m.lw.y - m.ls.y) < m.shoulderWidth * 0.45 &&
                       Math.abs(m.rw.y - m.rs.y) < m.shoulderWidth * 0.45;
        const wideX = Math.abs(m.lw.x - m.rw.x) > m.shoulderWidth * 2.0;
        return levelY && wideX;
      }
    },
    squat: {
      name: '🏋️ 深蹲撐住不准站',
      desc: '退後讓大腿與膝蓋入鏡，雙腳張開半蹲壓低臀部！',
      check: (m) => {
        if (!m || !m.lh || !m.rh || !m.lk || !m.rk) return false;
        if (m.lk.visibility < 0.4 || m.rk.visibility < 0.4) return false;
        const hipY = (m.lh.y + m.rh.y) / 2;
        const kneeY = (m.lk.y + m.rk.y) / 2;
        return (kneeY - hipY) < m.shoulderWidth * 0.65;
      }
    }
  };

  let poseState = {
    ruleMode: 'reward',
    targetKey: 'hands_up',
    isMatchedNow: false,
    isCrossArmedNow: false,
    crossArmHoldSec: 0,
    phase: 'idle',
    holdProgress: 0,
    undressElapsedSec: 0,
    rewardSecLeft: 0,
    punishSecLeft: 0,
    punishBreakSec: 0,
    rewardIntensity: 14,
    punishIntensity: 16
  };

  function stopPoseSession() {
    poseSessionToken++;
    clearInterval(poseLoopTimer);
    poseLoopTimer = null;
    poseState.phase = 'idle';
    poseState.holdProgress = 0;
    poseState.undressElapsedSec = 0;
    poseState.crossArmHoldSec = 0;
    poseState.isMatchedNow = false;
    poseState.isCrossArmedNow = false;

    const hud = document.getElementById('pose-hud');
    if (hud) hud.classList.remove('matched', 'punishing', 'surrendered');
    const prog = document.getElementById('pose-progress');
    if (prog) prog.style.width = '0%';
  }

  function switchAppMode(mode) {
    currentAppMode = mode;
    document.getElementById('tab-chat').classList.toggle('active', mode === 'chat');
    document.getElementById('tab-pose').classList.toggle('active', mode === 'pose');
    document.getElementById('chat-view').classList.toggle('active', mode === 'chat');
    document.getElementById('pose-view').classList.toggle('active', mode === 'pose');

    if (mode === 'pose') {
      initFrontCameraPose();
    } else {
      stopPoseSession();
      window.speechSynthesis && window.speechSynthesis.cancel();
      sendMotorSpeed(0);
      document.getElementById('ui-mode').innerText = '待機';
      document.getElementById('pose-target-name').innerText = '準備開始考驗';
      document.getElementById('pose-sub-text').innerText = '建議退後約 1.5~2 公尺，讓腰部以上完整入鏡';
      stopFrontCamera();
    }
  }

  function togglePoseRuleMode() {
    poseState.ruleMode = poseState.ruleMode === 'reward' ? 'punish' : 'reward';
    const btn = document.getElementById('btn-pose-rule');
    const badge = document.getElementById('pose-rule-badge');
    if (poseState.ruleMode === 'reward') {
      btn.innerText = '🔄 切換：獎勵制';
      badge.innerText = '獎勵制：擺對姿勢維持 3 秒 → 獎勵抽插 10 秒';
    } else {
      btn.innerText = '🔄 切換：懲罰制';
      badge.innerText = '懲罰制：維持姿勢 15 秒，一偷懶走樣立刻抽插懲罰！';
    }
  }

  async function initFrontCameraPose() {
    if (isCameraRunning) return;
    const videoEl = document.getElementById('pose-video');
    const canvasEl = document.getElementById('pose-canvas');
    const ctx = canvasEl.getContext('2d', { willReadFrequently: true });

    document.getElementById('pose-sub-text').innerText = '正在啟動前置鏡頭與骨架辨識模型...';

    try {
      if (!poseDetector) {
        poseDetector = new Pose({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });
        poseDetector.setOptions({
  modelComplexity: 1,        // 從 0 改為 1，大幅減少關節點飄移
  smoothLandmarks: true,
  enableSegmentation: false,
  minDetectionConfidence: 0.65, // 提高偵測門檻，避免背景雜物被誤認成手臂
  minTrackingConfidence: 0.65
});
        poseDetector.onResults((results) => {
          if (currentAppMode !== 'pose') return;
          canvasEl.width = results.image.width;
          canvasEl.height = results.image.height;
          ctx.save();
          ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
          ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

          const distTip = document.getElementById('pose-distance-tip');
          const skinDebug = document.getElementById('skin-debug-tag');

          if (results.poseLandmarks) {
            const metrics = getBodyMetrics(results.poseLandmarks);

            if (!metrics) {
              poseState.isMatchedNow = false;
              poseState.isCrossArmedNow = false;
              distTip.innerText = '⚠️ 偵測不到完整肩膀，請往後退一步讓上半身入鏡！';
              distTip.style.color = '#fbbf24';
            } else {
              // 在畫上骨架線之前，先取樣胸腹區域真實膚色比例
              currentTorsoSkinRatio = computeTorsoSkinRatio(ctx, canvasEl.width, canvasEl.height, metrics);
              if (skinDebug) {
                skinDebug.innerText = `裸露度: ${Math.round(currentTorsoSkinRatio * 100)}%`;
                skinDebug.style.color = currentTorsoSkinRatio >= 0.46 ? '#34d399' : '#9ca3af';
              }

              if (metrics.shoulderWidth > 0.62) {
                distTip.innerText = '📏 距離太近了！請再往後退半步，避免舉手超出畫面';
                distTip.style.color = '#fbbf24';
              } else if (metrics.shoulderWidth < 0.14) {
                distTip.innerText = '📏 距離太遠了！請稍微往前靠近一點';
                distTip.style.color = '#fbbf24';
              } else {
                distTip.innerText = '✅ 站位距離完美！雙手胸前交叉比 X (1秒) = 遠距離快射了煞車';
                distTip.style.color = '#34d399';
              }

              const isCross = checkCrossArmsSurrender(metrics);
              poseState.isCrossArmedNow = isCross;

              const poseObj = POSE_LIBRARY[poseState.targetKey];
              const matched = poseObj ? poseObj.check(metrics) : false;
              poseState.isMatchedNow = matched;

              const lineColor = isCross ? '#f59e0b' : (matched ? '#10b981' : '#e11d48');
              drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: lineColor, lineWidth: 4 });
              drawLandmarks(ctx, results.poseLandmarks, { color: '#ffffff', lineWidth: 1, radius: 3 });
            }
          } else {
            poseState.isMatchedNow = false;
            poseState.isCrossArmedNow = false;
            distTip.innerText = '⚠️ 畫面中找不到人，請站到前置鏡頭前';
            distTip.style.color = '#f87171';
          }
          ctx.restore();
        });
      }

      cameraInstance = new Camera(videoEl, {
        onFrame: async () => {
          if (currentAppMode === 'pose' && poseDetector) {
            await poseDetector.send({ image: videoEl });
          }
        },
        facingMode: 'user',
        width: 480,
        height: 640
      });

      await cameraInstance.start();
      isCameraRunning = true;
      document.getElementById('pose-sub-text').innerText = '鏡頭已就緒！按「▶️ 開始 / 換題」讓女王出題';
    } catch (err) {
      document.getElementById('pose-sub-text').innerText = '⚠️ 無法開啟前置鏡頭：' + err.message;
    }
  }

  function stopFrontCamera() {
    if (cameraInstance) {
      cameraInstance.stop();
      isCameraRunning = false;
    }
  }

  // 點擊「▶️ 開始 / 換題」時的入口：若勾選「開場先要求脫掉上衣」且尚未脫衣，先進入脫衣檢查關卡
  function handleStartOrNextPose() {
    const requireUndress = document.getElementById('require-undress-chk').checked;
    if (requireUndress && !hasCompletedUndress) {
      startUndressStage();
    } else {
      requestNextPoseTask();
    }
  }

  // 第一關：強制要求脫掉上衣（透過胸腹膚色比例即時判讀）
  function startUndressStage() {
    if (currentAppMode !== 'pose') return;
    stopPoseSession();
    sendMotorSpeed(0);

    poseState.targetKey = 'undress_top';
    poseState.phase = 'undressing';
    poseState.holdProgress = 0;
    poseState.undressElapsedSec = 0;

    const queenLine = '在開始姿勢考驗之前，先把你身上的衣服給我脫掉！別磨磨蹭蹭的，讓本女王看清楚！';
    document.getElementById('pose-target-name').innerText = '👕 第一關：脫掉上衣！';
    document.getElementById('pose-queen-text').innerText = queenLine;
    speakQueenText(queenLine);

    const hud = document.getElementById('pose-hud');
    const subText = document.getElementById('pose-sub-text');
    const progBar = document.getElementById('pose-progress');
    hud.classList.remove('matched', 'punishing', 'surrendered');

    poseLoopTimer = setInterval(() => {
      if (currentAppMode !== 'pose') { stopPoseSession(); return; }

      poseState.undressElapsedSec += 0.2;
      const pct = Math.round(currentTorsoSkinRatio * 100);

      if (poseState.isMatchedNow) {
        // 已偵測到脫掉上衣（裸露度 >= 46%）
        sendMotorSpeed(0);
        poseState.holdProgress += 0.2;
        hud.classList.add('matched');
        hud.classList.remove('punishing');
        document.getElementById('ui-mode').innerText = '脫衣確認中';
        subText.innerText = `✅ 偵測到上半身已裸露 (${pct}%)！確認中：${poseState.holdProgress.toFixed(1)} / 2.0 秒`;
        progBar.style.background = '#10b981';
        progBar.style.width = `${Math.min(100, (poseState.holdProgress / 2.0) * 100)}%`;

        if (poseState.holdProgress >= 2.0) {
          clearInterval(poseLoopTimer);
          hasCompletedUndress = true;
          sendMotorSpeed(0);
          requestNextPoseTask('[系統自動回報：使用者已經乖乖把上衣脫掉、光著上半身站在鏡頭前了！請用高傲或嘲諷的語氣評價他的身材，並立刻指派第一個姿勢考驗！]');
        }
      } else {
        poseState.holdProgress = Math.max(0, poseState.holdProgress - 0.1);
        hud.classList.remove('matched');
        progBar.style.width = `${(poseState.holdProgress / 2.0) * 100}%`;

        // 若超過 12 秒還沒脫完，啟動低頻催促脈衝
        if (poseState.undressElapsedSec > 12) {
          hud.classList.add('punishing');
          const pulseOn = (Math.floor(poseState.undressElapsedSec * 2) % 2) === 0;
          sendMotorSpeed(pulseOn ? 10 : 0);
          document.getElementById('ui-mode').innerText = '催促脫衣懲罰';
          subText.innerText = `⚡ 太慢了！脈衝催促中（目前裸露度 ${pct}% / 需達 46%）`;
          progBar.style.background = '#e11d48';
        } else {
          document.getElementById('ui-mode').innerText = '等待脫掉上衣';
          subText.innerText = `👕 請脫掉上衣露出胸腹（目前偵測裸露度：${pct}% / 目標 46%）`;
          progBar.style.background = '#f59e0b';
        }
      }
    }, 200);
  }

  async function requestNextPoseTask(autoFeedbackText = null) {
    if (currentAppMode !== 'pose') return;
    stopPoseSession();
    const myToken = poseSessionToken;

    sendMotorSpeed(0);
    poseState.phase = 'loading';
    document.getElementById('pose-target-name').innerText = '女王思考指令中...';
    document.getElementById('pose-sub-text').innerText = '請稍候';

    // 排除脫衣關卡，從四個正式動作中抽選
    const actionKeys = ['hands_up', 'hands_behind_head', 't_pose', 'squat'];
    const fallbackKey = actionKeys[Math.floor(Math.random() * actionKeys.length)];

    const url = document.getElementById('api-url').value.trim();
    const key = document.getElementById('api-key').value.trim();
    const model = document.getElementById('api-model').value.trim();

    const userReport = autoFeedbackText || '女王，我已經站在鏡頭前準備好了，請命令我做一個姿勢！';
    const poseInstruction = `[系統目前處於前置鏡頭姿勢考驗模式，規則為「${poseState.ruleMode === 'reward' ? '達成獎勵抽插10秒' : '未達成持續懲罰抽插'}」。請從以下四個姿勢代碼中選一個考驗他：hands_up（雙手舉高投降）、hands_behind_head（雙手抱頭屈服）、t_pose（雙手水平張開）、squat（深蹲撐住）。請只輸出合法 JSON：{"pose_key": "上述四選一", "intensity": 10到20的整數, "dialogue": "用傲慢命令的語氣叫他擺出該姿勢的繁體中文台詞"}]`;

    const tempMessages = [
      ...chatHistory,
      { role: 'user', content: `${userReport}\n${poseInstruction}` }
    ];

    let chosenKey = fallbackKey;
    let chosenIntensity = 15;
    let queenLine = `現在立刻給我擺出「${POSE_LIBRARY[chosenKey].name}」，不准偷懶！`;

    try {
      if (key) {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
          body: JSON.stringify({ model, messages: tempMessages, temperature: 0.85 })
        });
        const data = await res.json();
        let reply = data.choices[0].message.content.trim().replace(/^```json\s*/i, '').replace(/```\s*$/i, '');
        const parsed = JSON.parse(reply);
        if (actionKeys.includes(parsed.pose_key)) chosenKey = parsed.pose_key;
        chosenIntensity = Math.min(20, Math.max(8, parseInt(parsed.intensity) || 15));
        if (parsed.dialogue) queenLine = parsed.dialogue;
      }
    } catch (_) {}

    if (currentAppMode !== 'pose' || myToken !== poseSessionToken) return;

    startPoseChallenge(chosenKey, chosenIntensity, queenLine);
  }

  function startPoseChallenge(poseKey, intensity, queenLine) {
    if (currentAppMode !== 'pose') return;
    poseState.targetKey = poseKey;
    poseState.rewardIntensity = intensity;
    poseState.punishIntensity = intensity;
    poseState.crossArmHoldSec = 0;

    const poseObj = POSE_LIBRARY[poseKey];
    document.getElementById('pose-target-name').innerText = poseObj.name;
    document.getElementById('pose-queen-text').innerText = queenLine;
    speakQueenText(queenLine);

    const hud = document.getElementById('pose-hud');
    const subText = document.getElementById('pose-sub-text');
    const progBar = document.getElementById('pose-progress');
    hud.classList.remove('matched', 'punishing', 'surrendered');

    function checkCrossBrakeTick() {
      if (poseState.isCrossArmedNow) {
        poseState.crossArmHoldSec += 0.2;
        hud.classList.add('surrendered');
        subText.innerText = `🙅 偵測到胸前比 X 求饒手勢！維持 ${poseState.crossArmHoldSec.toFixed(1)} / 1.0 秒觸發緊急煞車...`;
        if (poseState.crossArmHoldSec >= 1.0) {
          triggerPoseEdgeBrake();
          return true;
        }
      } else {
        poseState.crossArmHoldSec = Math.max(0, poseState.crossArmHoldSec - 0.2);
        hud.classList.remove('surrendered');
      }
      return false;
    }

    if (poseState.ruleMode === 'reward') {
      poseState.phase = 'holding';
      poseState.holdProgress = 0;

      poseLoopTimer = setInterval(() => {
        if (currentAppMode !== 'pose') { stopPoseSession(); return; }
        if (checkCrossBrakeTick()) return;

        if (poseState.phase === 'holding') {
          document.getElementById('ui-mode').innerText = '等待擺好姿勢';
          if (poseState.isMatchedNow) {
            poseState.holdProgress += 0.2;
            hud.classList.add('matched');
            if (!poseState.isCrossArmedNow) {
              subText.innerText = `✅ 姿勢正確！保持住：${poseState.holdProgress.toFixed(1)} / 3.0 秒`;
            }
            progBar.style.background = '#10b981';
            progBar.style.width = `${Math.min(100, (poseState.holdProgress / 3) * 100)}%`;

            if (poseState.holdProgress >= 3.0) {
              poseState.phase = 'rewarding';
              poseState.rewardSecLeft = 10;
              sendMotorSpeed(poseState.rewardIntensity);
              document.getElementById('ui-mode').innerText = '姿勢獎勵抽插';
              speakQueenText('做得不錯，賞你十秒鐘！不准射出來，受不了就胸前比叉叉！');
            }
          } else {
            poseState.holdProgress = Math.max(0, poseState.holdProgress - 0.1);
            hud.classList.remove('matched');
            if (!poseState.isCrossArmedNow) {
              subText.innerText = `❌ ${poseObj.desc}`;
            }
            progBar.style.width = `${(poseState.holdProgress / 3) * 100}%`;
          }
        } else if (poseState.phase === 'rewarding') {
          poseState.rewardSecLeft -= 0.2;
          if (!poseState.isCrossArmedNow) {
            subText.innerText = `🔥 獎勵抽插中！剩餘 ${Math.max(0, poseState.rewardSecLeft).toFixed(1)} 秒（強度 ${poseState.rewardIntensity}）`;
          }
          progBar.style.background = '#e11d48';
          progBar.style.width = `${Math.max(0, (poseState.rewardSecLeft / 10) * 100)}%`;

          if (poseState.rewardSecLeft <= 0) {
            clearInterval(poseLoopTimer);
            sendMotorSpeed(0);
            poseState.phase = 'idle';
            requestNextPoseTask(`[系統自動回報：使用者已乖乖完成「${poseObj.name}」，並忍住了 10 秒獎勵抽插沒有射出來。請給予評價並緊接著指派下一個新姿勢！]`);
          }
        }
      }, 200);

    } else {
      poseState.phase = 'punish_prep';
      let prepLeft = 3.0;
      poseState.punishSecLeft = 15.0;
      poseState.punishBreakSec = 0;

      poseLoopTimer = setInterval(() => {
        if (currentAppMode !== 'pose') { stopPoseSession(); return; }
        if (checkCrossBrakeTick()) return;

        if (poseState.phase === 'punish_prep') {
          prepLeft -= 0.2;
          document.getElementById('ui-mode').innerText = '懲罰倒數準備';
          if (!poseState.isCrossArmedNow) {
            subText.innerText = `⏳ 快擺好姿勢！${Math.max(0, prepLeft).toFixed(1)} 秒後開始監視！`;
          }
          progBar.style.background = '#f59e0b';
          progBar.style.width = `${(prepLeft / 3) * 100}%`;
          if (prepLeft <= 0) {
            poseState.phase = 'punishing';
          }
        } else if (poseState.phase === 'punishing') {
          poseState.punishSecLeft -= 0.2;
          progBar.style.width = `${Math.max(0, (poseState.punishSecLeft / 15) * 100)}%`;

          if (poseState.isMatchedNow) {
            hud.classList.add('matched');
            hud.classList.remove('punishing');
            sendMotorSpeed(0);
            document.getElementById('ui-mode').innerText = '姿勢合格(暫停)';
            if (!poseState.isCrossArmedNow) {
              subText.innerText = `✅ 撐住！剩餘 ${Math.max(0, poseState.punishSecLeft).toFixed(1)} 秒（一走樣就開抽）`;
            }
            progBar.style.background = '#10b981';
          } else {
            poseState.punishBreakSec += 0.2;
            hud.classList.remove('matched');
            hud.classList.add('punishing');
            sendMotorSpeed(poseState.punishIntensity);
            document.getElementById('ui-mode').innerText = '姿勢走樣懲罰中';
            if (!poseState.isCrossArmedNow) {
              subText.innerText = `⚡ 姿勢跑掉了！懲罰抽插中（剩 ${Math.max(0, poseState.punishSecLeft).toFixed(1)} 秒）`;
            }
            progBar.style.background = '#e11d48';
          }

          if (poseState.punishSecLeft <= 0) {
            clearInterval(poseLoopTimer);
            sendMotorSpeed(0);
            poseState.phase = 'idle';
            const brokeTime = poseState.punishBreakSec.toFixed(1);
            requestNextPoseTask(`[系統自動回報：15 秒「${poseObj.name}」考驗結束，使用者中途姿勢走樣累計 ${brokeTime} 秒並被懲罰抽插。請嘲諷或評價他的表現，並立刻下達下一個姿勢指令！]`);
          }
        }
      }, 200);
    }
  }

  function triggerPoseEdgeBrake() {
    stopPoseSession();
    sendMotorSpeed(0);
    document.getElementById('ui-mode').innerText = '緊急寸止煞車';
    document.getElementById('pose-hud').classList.add('surrendered');
    document.getElementById('pose-target-name').innerText = '🥵 緊急寸止冷卻中';
    document.getElementById('pose-sub-text').innerText = '已收到求饒訊號，馬達已歸零！女王正在嘲笑你...';

    requestNextPoseTask('[系統緊急通報：使用者在姿勢考驗中被抽插到受不了，比出了投降叉叉／按下了「快射了」緊急煞車！請狠狠嘲諷他這麼快就差點失守，讓他冷卻幾秒後繼續下達下一個姿勢考驗！]');
  }
</script>
